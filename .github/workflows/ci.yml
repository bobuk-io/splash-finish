name: CI
on:
  push:
    # The branch commit is already tested before its release tag is published.
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macos-15 defaults to arm64, whose hosted pool has failed to acquire a
    # runner for this repo. Keep universal cross-compilation on the Intel pool.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Swift tests
        run: swift test
      - name: Installer tests
        run: python3 -m unittest discover -s Tests -v
      - name: Pi extension lifecycle
        run: node Tests/pi-extension.test.mjs
      - name: Rich pi question lifecycle
        run: node Tests/pi-questions.test.mjs
      - name: Build universal app
        run: SIGNING_MODE=adhoc ARCHES='arm64 x86_64' Scripts/package_app.sh release
      - name: Verify app, architectures and embedded version
        run: |
          codesign --verify --deep --strict 'build/Splash Finish.app'
          lipo 'build/Splash Finish.app/Contents/MacOS/SplashFinish' -verify_arch arm64 x86_64
          cmp build/Icon.icns 'build/Splash Finish.app/Contents/Resources/Icon.icns'
          test "$(plutil -extract CFBundleIconFile raw 'build/Splash Finish.app/Contents/Info.plist')" = Icon
          source version.env
          test "$(plutil -extract CFBundleShortVersionString raw 'build/Splash Finish.app/Contents/Info.plist')" = "$MARKETING_VERSION"
          test "$(plutil -extract CFBundleVersion raw 'build/Splash Finish.app/Contents/Info.plist')" = "$BUILD_NUMBER"
